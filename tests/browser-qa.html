<!doctype html><meta charset="utf-8"><title>ClipGuard 本地集成验证</title><style>body{font:16px/1.8 sans-serif;padding:30px;max-width:900px}pre{white-space:pre-wrap}</style><h1>真实识别集成验证</h1><p>使用公开 JFK 英文音频，生成含英文文字的视频，执行抽帧、语音、字幕与相同文件检测。</p><button id="run">运行验证</button><pre id="out">尚未运行</pre><script type="module">
import {extract,compare} from '/engine.js';
const out=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{out.textContent='准备生成测试视频…';const ac=new AudioContext(),wav=await fetch('/qa-jfk.wav').then(r=>r.arrayBuffer()),audio=await ac.decodeAudioData(wav);const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;document.body.append(canvas);const c=canvas.getContext('2d');function draw(){c.fillStyle='#174e43';c.fillRect(0,0,640,360);c.fillStyle='white';c.font='24px sans-serif';['And so my fellow Americans','ask not what your country','can do for you ask what you','can do for your country'].forEach((s,i)=>c.fillText(s,40,120+i*38));}draw();const dest=ac.createMediaStreamDestination();const src=ac.createBufferSource();src.buffer=audio;src.connect(dest);const stream=canvas.captureStream(2);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));const mr=new MediaRecorder(stream,{mimeType:mime});const chunks=[];mr.ondataavailable=e=>chunks.push(e.data);const done=new Promise(r=>mr.onstop=r);const redraw=setInterval(draw,400);mr.start();src.start();await new Promise(r=>src.onended=r);mr.stop();await done;clearInterval(redraw);stream.getTracks().forEach(t=>t.stop());await ac.close();const f=new File(chunks,'qa-jfk.'+(mime.includes('mp4')?'mp4':'webm'),{type:mime});out.textContent='已生成视频 '+f.size+' 字节；开始真实解析…';const features=await extract(f,p=>out.textContent=p);const report=compare(features,[{...features,id:'reference',enabled:true}]);out.textContent=JSON.stringify({duration:features.duration,frames:features.frames.length,speech:features.speech,subtitles:features.subtitles,speechStatus:features.speechStatus,subtitleStatus:features.subtitleStatus,errors:features.errors,identicalScore:report.score,identicalStatus:report.status},null,2);}catch(e){out.textContent='验证失败：'+e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
