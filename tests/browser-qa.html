<!doctype html><meta charset="utf-8"><title>识别v4浏览器验证</title><h1>字幕与花字独立识别验证</h1><p>生成4秒带英文文字、无音轨的测试视频；确认无BGM，检查不需要口播。</p><button id="run">运行验证</button><pre id="out">尚未运行</pre><script type="module">
import {extract,compare} from '../engine.js';
import {extractBgm,bgmSimilarity} from '../bgm.js';
function bgmFile(gain){const n=32000,bytes=new ArrayBuffer(44+n*2),v=new DataView(bytes),txt=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));txt(0,'RIFF');v.setUint32(4,36+n*2,true);txt(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);txt(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.round(gain*32000*Math.sin(2*Math.PI*[220,440,660,880][Math.floor(i/2000)%4]*i/8000)),true);return new File([bytes],'synthetic-bgm.wav',{type:'audio/wav'});}
const out=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{try{const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;document.body.append(canvas);const c=canvas.getContext('2d');function draw(){c.fillStyle='#174e43';c.fillRect(0,0,640,360);c.fillStyle='white';c.font='bold 30px sans-serif';c.fillText('Daily video quality check',40,315);c.font='bold 30px sans-serif';c.fillText('SPECIAL OFFER TODAY ONLY',40,130);}draw();const stream=canvas.captureStream(5),mime=['video/mp4','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t)),mr=new MediaRecorder(stream,{mimeType:mime}),chunks=[];mr.ondataavailable=e=>chunks.push(e.data);const done=new Promise(r=>mr.onstop=r),redraw=setInterval(draw,100);mr.start();await new Promise(r=>setTimeout(r,4000));mr.stop();await done;clearInterval(redraw);stream.getTracks().forEach(t=>t.stop());const file=new File(chunks,'qa-v2.'+(mime.includes('mp4')?'mp4':'webm'),{type:mime});const f=await extract(file,p=>out.textContent=p,{bgmMode:'none'});const bgm=await extractBgm(bgmFile(.7),4,p=>out.textContent=p),quieter=await extractBgm(bgmFile(.2),4,p=>out.textContent=p);const r=compare(f,[{...f,id:'template',enabled:true}]);out.textContent=JSON.stringify({duration:f.duration,subtitles:f.subtitles,subtitleStatus:f.subtitleStatus,overlays:f.overlays,overlayStatus:f.overlayStatus,bgm:f.bgm,bgmDecodeStatus:bgm.status,bgmVolumeSimilarity:bgmSimilarity(bgm,quieter),speech:f.speech,errors:f.errors,identicalStatus:r.status,oneLowItemStatus:compare(f,[{...f,sha:'d'.repeat(64),id:'another-reference',enabled:true,overlays:'Different promotional message'}]).status},null,2);}catch(e){out.textContent=e.stack;}};
</script>
